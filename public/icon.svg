<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="180" fill="#0a0a0b" />

  <!-- Neural network nodes -->
  <g fill="#ffffff">
    <!-- Outer ring nodes -->
    <circle cx="400" cy="320" r="22" />
    <circle cx="624" cy="380" r="22" />
    <circle cx="640" cy="500" r="22" />
    <circle cx="624" cy="640" r="22" />
    <circle cx="400" cy="700" r="22" />
    <circle cx="176" cy="640" r="22" />
    <circle cx="160" cy="500" r="22" />
    <circle cx="176" cy="380" r="22" />
    <!-- Center nodes -->
    <circle cx="512" cy="360" r="22" />
    <circle cx="512" cy="500" r="22" />
    <circle cx="512" cy="640" r="22" />
  </g>

  <!-- Neural network connections -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Outer ring connections -->
    <line x1="400" y1="320" x2="512" y2="360" />
    <line x1="512" y1="360" x2="624" y2="380" />
    <line x1="624" y1="380" x2="640" y2="500" />
    <line x1="640" y1="500" x2="624" y2="640" />
    <line x1="624" y1="640" x2="400" y2="700" />
    <line x1="400" y1="700" x2="176" y2="640" />
    <line x1="176" y1="640" x2="160" y2="500" />
    <line x1="160" y1="500" x2="176" y2="380" />
    <line x1="176" y1="380" x2="400" y2="320" />

    <!-- Cross connections through center -->
    <line x1="400" y1="320" x2="512" y2="500" />
    <line x1="512" y1="500" x2="400" y2="700" />
    <line x1="624" y1="380" x2="512" y2="640" />
    <line x1="512" y1="640" x2="176" y2="380" />
    <line x1="640" y1="500" x2="160" y2="500" />
    <line x1="160" y1="500" x2="640" y2="500" />

    <!-- Center vertical -->
    <line x1="512" y1="360" x2="512" y2="640" />
  </g>

  <!-- Text: LEARNING OS -->
  <text x="512" y="780" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">LEARNING OS</text>
</svg>
